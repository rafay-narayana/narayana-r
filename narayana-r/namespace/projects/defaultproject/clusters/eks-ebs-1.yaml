apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: eks-ebs-1
  project: defaultproject
spec:
  blueprint:
    name: default-upstream
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.35.4
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: ip-172-31-26-19
      operatingSystem: Ubuntu22.04
      privateIP: 172.31.26.19
      roles:
      - Worker
      - ControlPlane
      - Storage
    platformVersion: v1.4.0
  proxy: {}
  type: mks
