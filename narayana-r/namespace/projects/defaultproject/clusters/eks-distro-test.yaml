apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: eks-distro-test
  project: defaultproject
spec:
  blueprint:
    name: default-upstream
  config:
    installerTtl: 365
    kubernetesVersion: v1.34.7
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: ip-172-31-28-114
      operatingSystem: Ubuntu22.04
      privateIP: 172.31.28.114
      roles:
      - ControlPlane
      - Storage
      - Worker
    platformVersion: v1.4.0
  proxy: {}
  type: mks
