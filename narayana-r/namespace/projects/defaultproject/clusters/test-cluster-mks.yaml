apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: test-cluster-mks
  project: defaultproject
spec:
  blueprint:
    name: minimal
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.35.4
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: narayana-c1
      operatingSystem: Ubuntu24.04
      privateIP: 10.0.1.205
      roles:
      - ControlPlane
      - Worker
    platformVersion: v1.4.0
  proxy: {}
  type: mks
