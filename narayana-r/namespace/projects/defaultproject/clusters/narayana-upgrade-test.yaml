apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: narayana-upgrade-test
  project: defaultproject
spec:
  blueprint:
    name: default
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.33.11
    network:
      cni:
        name: Cilium
        version: 1.20.1
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: narayana-instance-t2
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.20
      roles:
      - Worker
    - arch: amd64
      hostname: narayana-instance-t1
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.183
      roles:
      - Worker
      - ControlPlane
    platformVersion: v1.3.2
  proxy: {}
  type: mks
