apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: narayana-aks1
  project: defaultproject
spec:
  blueprintConfig:
    name: minimal
  cloudCredentials: n-cred
  config:
    kind: aksClusterConfig
    metadata:
      name: narayana-aks1
    spec:
      managedCluster:
        apiVersion: "2025-05-01"
        identity:
          type: SystemAssigned
        location: centralindia
        properties:
          apiServerAccessProfile:
            enablePrivateCluster: true
            enablePrivateClusterPublicFQDN: false
          autoUpgradeProfile:
            nodeOsUpgradeChannel: None
            upgradeChannel: none
          disableLocalAccounts: false
          dnsPrefix: narayana-aks1-dns
          enableRBAC: true
          kubernetesVersion: 1.36.0
          networkProfile:
            loadBalancerSku: standard
            networkPlugin: kubenet
          powerState:
            code: Running
        sku:
          name: Base
          tier: Free
        tags:
          email: krishna.prasad@rafay.co
          env: dev
        type: Microsoft.ContainerService/managedClusters
      nodePools:
      - apiVersion: "2025-05-01"
        name: primary
        properties:
          count: 1
          enableAutoScaling: true
          maxCount: 1
          maxPods: 110
          minCount: 1
          mode: System
          orchestratorVersion: 1.36.0
          osType: Linux
          type: VirtualMachineScaleSets
          vmSize: Standard_B2s
        type: Microsoft.ContainerService/managedClusters/agentPools
      resourceGroupName: aks-kp-resource
  type: aks
