apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: testcluster-2node
  project: defaultproject
spec:
  blueprint:
    name: default
    version: latest
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.35.4
    network:
      cni:
        name: Cilium
        version: 1.20.1
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: narayana-instance-5
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.35
      roles:
      - Worker
      - ControlPlane
    - arch: amd64
      hostname: narayana-instance-4
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.77
      roles:
      - Worker
    platformVersion: v1.3.2
  proxy: {}
  type: mks
