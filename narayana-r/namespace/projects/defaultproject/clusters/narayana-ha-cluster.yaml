apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: narayana-ha-cluster
  project: defaultproject
spec:
  blueprint:
    name: default
  config:
    autoApproveNodes: true
    highAvailability: true
    installerTtl: 365
    kubernetesVersion: v1.35.4
    network:
      cni:
        name: Cilium
        version: 1.20.1
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: narayana-instance-m1
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.232
      roles:
      - Worker
      - ControlPlane
    - arch: amd64
      hostname: narayana-instance-w1
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.66
      roles:
      - Worker
    - arch: amd64
      hostname: narayana-instance-m2
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.39
      roles:
      - Worker
      - ControlPlane
    - arch: amd64
      hostname: narayana-instance-m3
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.1.147
      roles:
      - Worker
      - ControlPlane
    platformVersion: v1.3.2
  proxy: {}
  type: mks
