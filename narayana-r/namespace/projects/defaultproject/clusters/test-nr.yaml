apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: test-nr
  project: defaultproject
spec:
  blueprint:
    name: default
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.36.4
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: narayana-testc1
      operatingSystem: Ubuntu24.04
      privateIP: 10.0.1.222
      roles:
      - Worker
      - ControlPlane
    platformVersion: v1.6.0
  proxy: {}
  type: mks
