apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: narayana-test-ebs1
  project: narayana
spec:
  blueprint:
    name: default-upstream
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.36.4
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: ip-172-31-15-108
      operatingSystem: Ubuntu22.04
      privateIP: 172.31.15.108
      roles:
      - Worker
      - ControlPlane
    - arch: amd64
      hostname: ip-172-31-2-45
      operatingSystem: Ubuntu22.04
      privateIP: 172.31.2.45
      roles:
      - Worker
      - Storage
    platformVersion: v1.6.0
  proxy: {}
  type: mks
