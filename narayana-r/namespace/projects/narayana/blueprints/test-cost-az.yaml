apiVersion: infra.k8smgmt.io/v3
kind: Blueprint
metadata:
  name: test-cost-az
  project: narayana
spec:
  base:
    name: default-aks
    version: 4.3.2
  costProfile:
    name: test-ns-az
    version: v1.0
  defaultAddons:
    enableIngress: true
    enableMonitoring: true
    monitoring:
      gpuOperator: {}
      metricsServer: {}
      prometheusAdapter: {}
  driftWebhook:
    enabled: true
  type: custom
  version: v1.0
  versionState: active
