apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: nr-test-1
  project: narayana
spec:
  blueprint:
    name: default
    version: latest
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.36.4
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: narayana-vm3
      operatingSystem: Ubuntu24.04
      privateIP: 10.0.1.60
      roles:
      - Worker
      - ControlPlane
    platformVersion: v1.6.1
  proxy: {}
  type: mks
